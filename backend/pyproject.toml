[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firefairy"
version = "4.0.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.36",
    "langgraph>=0.2.50",
    "jinja2>=3.1.4",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
    "joblib>=1.4.0",
    "python-docx>=1.1.0",
    "pypdf>=5.0.0",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"